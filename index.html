<style>
:root{
  --bg:#F3EFE6; --surface:#FFFFFF; --surface2:#E8E3D8; --line:#D5CEC0;
  --ink:#161616; --muted:#6B655A; --gold:#B88A1B; --gold2:#E2BC4E; --red:#C8203A; --green:#1F7A45; --copper:#8E4B4F;
  --ongold:#1A1405; --onacc:#FFFFFF;
  --num:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --ui:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
  --script:'Oleo Script','Brush Script MT',Georgia,cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1E1E1E; --surface2:#2A2A2A; --line:#383838;
    --ink:#F4F1E8; --muted:#A39E92; --gold:#D6A936; --gold2:#F0CB5C; --red:#E5354E; --green:#2E9C5C; --copper:#A9606A;
    --ongold:#1A1405; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1E1E1E; --surface2:#2A2A2A; --line:#383838;
  --ink:#F4F1E8; --muted:#A39E92; --gold:#D6A936; --gold2:#F0CB5C; --red:#E5354E; --green:#2E9C5C; --copper:#A9606A;
  --ongold:#1A1405; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{display:none;height:100%;max-width:640px;margin:0 auto;flex-direction:column}
.screen.on{display:flex}

/* ---------- Startseite ---------- */
#setup{overflow-y:auto;padding:0 16px 22px}
.hero{position:relative;margin:0 -16px;height:min(50vh,430px);flex:none;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,var(--bg) 98%)}
.brand{position:relative;margin-top:-58px;z-index:1;text-align:center}
.brand h1{font-family:var(--script);font-weight:700;color:var(--red);font-size:52px;line-height:1;margin:0;
  text-shadow:0 2px 0 var(--bg),0 0 18px var(--bg)}
.brand p{margin:6px 0 0;font-family:var(--num);font-weight:700;font-size:22px;color:var(--gold);letter-spacing:1px}
.form{display:flex;flex-direction:column;gap:20px;margin-top:22px}
.field h2{font-size:15px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:12px 4px;border-radius:9px;font-weight:600;font-size:15px;line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 -3px 0 var(--gold),0 1px 2px rgba(0,0,0,.15)}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.game{padding:12px 8px 10px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:center}
.game b{display:block;font-family:var(--num);font-weight:800;font-size:24px;line-height:1}
.game span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.game[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(var(--surface),var(--surface)) padding-box;box-shadow:inset 0 0 0 1px var(--gold)}
.game[aria-pressed="true"] b{color:var(--gold)}
.hint{font-size:14px;color:var(--muted);margin:8px 2px 0;line-height:1.4}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.prow button{width:46px;height:46px;border-radius:10px;background:var(--surface2);font-size:22px;color:var(--muted)}
.addp{margin-top:4px;padding:12px;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted);font-weight:600;width:100%}
.resume+.resume,#logBtn{margin-top:-8px}
.start{padding:18px;border-radius:14px;background:var(--gold);color:var(--ongold);
  font-family:var(--num);font-weight:800;font-size:28px;letter-spacing:.5px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.resume{padding:14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--gold);font-weight:700}

/* ---------- Spiel ---------- */
#game{padding:8px 10px 10px;gap:8px}
.top{display:flex;align-items:center;gap:8px;padding:2px 2px}
.top img{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid var(--gold)}
.info{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{font-size:13px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.g{color:var(--gold)}
.chip.pr{background:var(--green);color:var(--onacc)}
.prnote{display:inline-block;margin-top:6px;font-size:13.5px;font-weight:700;color:var(--onacc);background:var(--green);border-radius:6px;padding:2px 8px}
.menu{padding:8px 12px;border-radius:9px;background:var(--surface2);font-weight:600;font-size:14px}

.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board.solo{grid-template-columns:1fr}
.p{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 9px;min-width:0;overflow:hidden}
.p.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.p.active::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
.pn{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:16px}
.pn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legs{display:flex;gap:3px;flex:none}
.legs i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.legs i.w{background:var(--gold);border-color:var(--gold)}
.score{font-family:var(--num);font-weight:800;line-height:.95;font-size:clamp(52px,17vw,96px);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.p.active .score{color:var(--gold)}
.board.many .score{font-size:clamp(40px,12vw,68px)}
.score small{font-size:.38em;color:var(--muted);font-weight:700;margin-right:4px}
.stats{display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
.prog{display:flex;gap:2px;margin:6px 0 4px}
.prog i{flex:1;height:6px;border-radius:2px;background:var(--surface2)}
.prog i.d{background:var(--green)}
.prog i.c{background:var(--red)}

.turn{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.slots{display:flex;gap:6px}
.slot{width:54px;height:44px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;
  font-family:var(--num);font-weight:700;font-size:22px}
.slot.e{color:var(--muted);font-size:16px;font-family:var(--ui);font-weight:500}
.slot.miss{color:var(--muted)}
.tsum{margin-left:auto;text-align:right}
.tsum .v{font-family:var(--num);font-weight:800;font-size:30px;line-height:1}
.tsum .co{font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.tsum .co.none{color:var(--muted);font-weight:500}
.toast{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;background:var(--gold);color:var(--ongold);
  font-family:var(--num);font-weight:800;font-size:30px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.modebar .seg{padding:3px}
.modebar .seg button{padding:7px 4px;font-size:14px}

.pad{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:6px;min-height:0}
.k{border-radius:11px;background:var(--surface);border:1px solid var(--line);font-family:var(--num);font-weight:700;
  font-size:clamp(22px,6.4vw,32px);display:grid;place-items:center;min-height:44px;transition:transform .06s}
.k:active{transform:scale(.95);background:var(--surface2)}
.k.sm{font-family:var(--ui);font-weight:600;font-size:16px}
.k.big{font-family:var(--num);font-weight:800;font-size:34px}
.k.dbl[aria-pressed="true"],.k.gD{background:var(--green);border-color:var(--green);color:var(--onacc)}
.k.tpl[aria-pressed="true"],.k.gT{background:var(--red);border-color:var(--red);color:var(--onacc)}
.k.gS{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pad.mD .num{box-shadow:inset 0 -4px 0 var(--green)}
.pad.mT .num{box-shadow:inset 0 -4px 0 var(--red)}
.k:disabled{opacity:.35}
.k.ok{background:var(--gold);border-color:var(--gold);color:var(--ongold)}

/* ---------- Overlay ---------- */
.ov{position:fixed;inset:0;background:rgba(8,8,8,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.on{display:flex}
.card{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 20px;width:100%;max-width:400px;text-align:center;
  max-height:100%;overflow-y:auto;border:1px solid var(--line)}
.card .cup{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:3px solid var(--gold);margin:-4px auto 10px;display:block}
.card h3{font-family:var(--num);font-weight:800;font-size:36px;line-height:1.05;margin:0 0 6px}
.card h3.win{font-family:var(--script);font-weight:700;color:var(--red);font-size:40px}
.card p{color:var(--muted);margin:0 0 16px;font-size:16px}
.card table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:15px}
.card td,.card th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.card td:first-child,.card th:first-child{text-align:left}
.card th{color:var(--muted);font-weight:600}
.card tr.top1 td{color:var(--gold);font-weight:700}
.help{text-align:left;margin:0 0 16px;padding:0 0 0 18px;font-size:15px;line-height:1.45;color:var(--ink)}
.help li{margin-bottom:8px}
.help b{color:var(--gold)}
 #log{overflow-y:auto;padding:10px 14px 24px;gap:14px}
.lhead{display:flex;align-items:center;justify-content:space-between}
.lhead h2{font-family:var(--num);font-weight:800;font-size:30px;margin:0}
.lhead span{width:70px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.filters select{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 10px;min-width:0}
.empty{text-align:center;color:var(--muted)}
.empty img{width:140px;height:140px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:3px solid var(--gold);margin:20px auto 12px;display:block}
.cupcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--gold);border-radius:16px;padding:12px}
.cupcard img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:2px solid var(--gold);flex:none}
.cupcard span{display:block;font-size:13px;color:var(--gold);font-weight:700}
.cupcard b{display:block;font-family:var(--script);font-weight:700;color:var(--red);font-size:32px;line-height:1.1;margin:2px 0}
.cupcard small{color:var(--muted);font-size:13.5px}
h3.lt{font-family:var(--num);font-weight:800;font-size:22px;margin:6px 0 -4px}
.tw{overflow-x:auto}
table.lt{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--surface);border-radius:12px;overflow:hidden}
table.lt th,table.lt td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.lt th:first-child,table.lt td:first-child{text-align:left;padding-left:10px}
table.lt th:last-child,table.lt td:last-child{padding-right:10px}
table.lt th{color:var(--muted);font-weight:600;font-size:13px}
table.lt tr.top1 td{color:var(--gold);font-weight:700}
table.lt tr.sum td{font-weight:700;border-bottom:0}
.calc{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.calc b{color:var(--ink)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.gh b{font-family:var(--num);font-size:20px}
.gh span{flex:1;font-size:13px;color:var(--muted)}
.del{width:34px;height:34px;border-radius:8px;color:var(--muted);background:var(--surface2)}
.gr{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;padding:4px 0;border-top:1px solid var(--line)}
.gr span:last-child{color:var(--muted);text-align:right}
.gr.won span:first-child{font-weight:700}
.gr em{font-style:normal;font-size:12px;font-weight:700;color:var(--ongold);background:var(--gold);border-radius:6px;padding:1px 6px;margin-left:4px}
.gr.me span:first-child{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.daycard{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.daycard .dd{font-weight:700}
.daycard .dc{color:var(--gold);font-weight:700;text-align:right}
.daycard .dm{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.sheet{max-height:min(48vh,440px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sheet table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{padding:0;border-bottom:1px solid var(--line);text-align:center}
.sheet thead th{position:sticky;top:0;z-index:1;background:var(--surface);font-size:14px;font-weight:700;padding:8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.sheet thead th.on{color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.sheet tbody th{font-family:var(--num);font-size:18px;color:var(--muted);width:52px}
.kc{width:100%;height:34px;font-family:var(--num);font-weight:700;font-size:21px}
.kc.on{background:var(--gold);color:var(--ongold);border-radius:6px}
.sheet tfoot th,.sheet tfoot td{position:sticky;bottom:0;background:var(--surface2);font-family:var(--num);font-weight:800;font-size:22px;padding:8px 4px;color:var(--gold);border-bottom:0}
.sheet tfoot th{font-family:var(--ui);font-size:14px;color:var(--ink)}
.gs{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 6px}
.gs i{font-style:normal;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.clubcard{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:14.5px;font-weight:600}
.clubcard span{flex:1}
.clubcard b{font-size:13px;color:var(--gold)}
.clubcard.sm{margin-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dot.on{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 30%,transparent)}
.dot.wait{background:var(--gold)}
.dot.err{background:var(--red)}
.pwin{width:100%;font:inherit;font-size:18px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:6px}
.pwmsg{min-height:1.4em;font-size:14px;color:var(--red)!important;margin:0 0 10px!important}
.field h2.sub{margin-top:16px}
.prow.sel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 12px}
.prow.sel button{width:42px;height:42px}
.pnum{font-family:var(--num);font-weight:800;color:var(--gold);font-size:22px;width:20px}
.pname{flex:1;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster{display:flex;flex-wrap:wrap;gap:8px}
.rchip{padding:10px 15px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:15.5px}
.rchip.on{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.newp{display:flex;gap:8px;margin-top:12px}
.newp input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.newp button{padding:0 16px;border-radius:10px;background:var(--gold);color:var(--ongold);font-weight:700}
#rosterMsg{margin:6px 0 0!important;min-height:0}
.mlist{text-align:left;margin:0 0 16px;max-height:45vh;overflow:auto}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.mrow button{padding:7px 12px;border-radius:8px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--muted)}
.mrow button.warn{background:var(--red);color:var(--onacc)}
.ptr{--py:0px;position:fixed;left:50%;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;
  padding:9px 16px 9px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--gold);color:var(--ink);font-size:14.5px;font-weight:600;
  box-shadow:0 6px 18px rgba(0,0,0,.28);max-width:92vw;transform:translate(-50%,calc(var(--py) - 64px));opacity:0;pointer-events:none;white-space:nowrap}
.ptr-i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ongold);font-weight:800;font-size:15px;transition:transform .15s}
.ptr.ready .ptr-i{background:var(--green);color:var(--onacc)}
.ptr.spin .ptr-i{animation:ptrspin .8s linear infinite}
.ptr.done{transition:transform .2s}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.ptrhint{margin:-6px 2px 0!important;font-size:13px!important}
#setup,#log{overscroll-behavior-y:contain}
.btns{display:flex;flex-direction:column;gap:8px}
.btns button{padding:14px;border-radius:12px;font-weight:700;font-size:17px;background:var(--surface2)}
.btns .pri{background:var(--gold);color:var(--ongold)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const load=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const store=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const fmt1=n=>n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const pct=(a,b)=>b?Math.round(a/b*100)+' %':'–';
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HERO=$('#heroImg').src;

const DEF={knRounds:10,logCat:'darts',practice:false,basis:'thrown',game:'x01',start:501,out:'double',legs:1,atcBull:true,atcSkip:false,hsRounds:15,players:['Spieler 1','Spieler 2'],mode:'darts'};
let S=Object.assign({},DEF,load('dart.settings')||{});
if(!S.v6){S.v6=1;S.hsRounds=15;S.hsMode='final';}
let G=load('dart.game2');
let undo=load('dart.undo2')||[];
let H=load('dart.history')||[];
let roster=[];
const saveH=()=>{if(!col)store('dart.history',H)};
let col=null;
let mod=1, entry='';

/* ---------- Checkout-Rechner ---------- */
const DARTS=[];
for(let n=20;n>=1;n--){DARTS.push({l:String(n),v:n,m:1,c:0},{l:'T'+n,v:3*n,m:3,c:1},{l:'D'+n,v:2*n,m:2,c:2})}
DARTS.push({l:'25',v:25,m:1,c:1},{l:'Bull',v:50,m:2,c:2});
const DPREF=[40,32,36,24,20,16,50,8,38,34,30,28,26,22,18,14,12,10,6,4,2];
const byVal={};DARTS.forEach(d=>{(byVal[d.v]=byVal[d.v]||[]).push(d)});
const cheapest=v=>(byVal[v]||[]).slice().sort((a,b)=>a.c-b.c)[0];
function checkout(rem,left,dbl){
  if(rem>170||rem<1||(dbl&&rem<2)) return null;
  const fins=DARTS.filter(d=>dbl?d.m===2:true);
  const rank=f=>dbl?DPREF.indexOf(f.v):f.c;
  for(let k=1;k<=left;k++){
    let best=null,bs=1e9;
    for(const f of fins){
      const r=rem-f.v; if(r<0) continue;
      if(k===1){if(r===0){const s=rank(f);if(s<bs){bs=s;best=[f]}}continue}
      if(k===2){const a=cheapest(r);if(a){const s=rank(f)*10+a.c;if(s<bs){bs=s;best=[a,f]}}continue}
      for(const a of DARTS){const b=cheapest(r-a.v);if(!b||b.v>a.v)continue;
        const s=rank(f)*100+(a.c+b.c)*10-a.v/100;if(s<bs){bs=s;best=[a,b,f]}}
    }
    if(best) return best.map(d=>d.l).join(' ');
  }
  return null;
}
const BOGEY=new Set([159,162,163,165,166,168,169]);
const BAD_TOTAL=new Set([163,166,169,172,173,175,176,178,179]);

/* ---------- Startseite ---------- */
const GAMES={
  x01:{t:'X01',d:'301 bis 701',h:'Von der Startzahl auf genau null herunterspielen. Wer zuerst null erreicht, gewinnt das Leg.'},
  atc:{t:'Clock',d:'Around the Clock',h:'Die Zahlen 1 bis 20 der Reihe nach treffen. Wer zuerst durch ist, gewinnt.'},
  hs:{t:'Highscore',d:'Punkte sammeln',h:'Feste Anzahl Runden mit je 3 Pfeilen. Die meisten Punkte gewinnen.'},
  kn:{t:'Kniffel',d:'Endstände',h:'Ihr spielt das Kniffel-Blatt ganz normal am Tisch und tragt nach jeder Kniffelrunde den Endstand jedes Spielers ein. Am Ende werden alle Runden zusammengezählt.'}
};
const HELP={
  start:{301:'Mit 301 Punkten startet jeder Spieler. Ein kurzes Spiel, gut zum Einwerfen oder für Anfänger.',
    501:'Mit 501 Punkten startet jeder Spieler. Der Klassiker, so wird bei Turnieren und im Fernsehen gespielt.',
    701:'Mit 701 Punkten startet jeder Spieler. Ein langes Spiel, beliebt bei Mannschaften oder vielen Mitspielern.'},
  out:{double:'Double Out: Der letzte Pfeil muss genau auf null kommen und dabei ein Double (der schmale äußere Ring) oder das Bull treffen. Bleibt 1 Punkt übrig oder landet der letzte Pfeil im Single-Feld, ist es ein Bust und die Aufnahme zählt nicht. So wird offiziell gespielt.',
    single:'Single Out: Jedes Feld zählt für das Finish, Hauptsache der Punktestand landet genau auf null. Einfacher und gut für Anfänger. Wer mehr wirft, als übrig ist, hat einen Bust und die Aufnahme zählt nicht.'},
  legs:n=>n===1?'Ein einziges Leg entscheidet: Wer zuerst auf null kommt, gewinnt das Spiel.':
    `First to ${n}: Ein Leg endet, wenn jemand auf null kommt. Wer zuerst ${n} Legs gewinnt, gewinnt das Spiel. Wer anwerfen darf, wechselt mit jedem Leg.`,
  atcBull:{false:'Nach der 20 bist du fertig. Wer zuerst alle Zahlen von 1 bis 20 getroffen hat, gewinnt.',
    true:'Nach der 20 musst du zum Schluss noch das Bull treffen. Dabei zählt auch das Single Bull (25), also der grüne Ring.'},
  atcSkip:{false:'Jeder Treffer im richtigen Zahlenfeld bringt dich genau eine Zahl weiter, egal ob Single, Double oder Triple.',
    true:'Ein Double bringt dich 2 Zahlen weiter, ein Triple 3 Zahlen. Das Spiel geht schneller und belohnt genaue Würfe.'},
  kn:n=>`Das Blatt hat ${n} Kniffelrunden. Nach jeder Runde tragt ihr den Endstand jedes Spielers ein, am Ende werden alle ${n} Runden zusammengezählt. Die höchste Summe gewinnt den Abend.`,
  rounds:n=>`Jeder Spieler wirft ${n} Runden mit je 3 Pfeilen, alle Treffer werden zusammengezählt. Wer am Ende die meisten Punkte hat, gewinnt. Pro Runde sind höchstens 180 Punkte möglich. Im Spiel könnt ihr jede Runde einzeln eintragen oder am Ende nur den Endstand jedes Spielers.`
};
function seg(el,opts,cur,on){
  el.innerHTML='';
  opts.forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;
    b.setAttribute('aria-pressed',String(v===cur));b.onclick=()=>{on(v);buzz()};el.appendChild(b)});
}
function field(title,hint){const f=document.createElement('div');f.className='field';f.innerHTML=`<h2>${title}</h2><div class="seg"></div>`+(hint?`<p class="hint">${hint}</p>`:'');$('#opts').appendChild(f);return f.querySelector('.seg')}
function renderSetup(){
  const g=$('#games');g.innerHTML='';
  for(const k in GAMES){const b=document.createElement('button');b.className='game';b.setAttribute('aria-pressed',String(S.game===k));
    b.innerHTML=`<b>${GAMES[k].t}</b><span>${GAMES[k].d}</span>`;b.onclick=()=>{S.game=k;buzz();renderSetup()};g.appendChild(b)}
  $('#gameHint').textContent=GAMES[S.game].h;
  $('#opts').innerHTML='';
  seg(field('Modus',S.practice?'Übung: Du spielst ganz normal, das Ergebnis wird aber nicht gespeichert und zählt weder für den Schierker Pokal noch für die Kasse. Ideal zum Einwerfen oder alleine üben.':'Wertungsspiel: Das Ergebnis wird im Protokoll gespeichert und zählt für die Tagesauswertung, den Schierker Pokal und die Kasse.'),
    [[false,'Wertungsspiel'],[true,'Übung']],S.practice,v=>{S.practice=v;renderSetup()});
  $('#startBtn').textContent=S.practice?'Übung starten':'Spiel starten';
  if(S.game==='x01'){
    seg(field('Startpunkte',HELP.start[S.start]),[[301,'301'],[501,'501'],[701,'701']],S.start,v=>{S.start=v;renderSetup()});
    seg(field('Finish',HELP.out[S.out]),[['double','Double Out'],['single','Single Out']],S.out,v=>{S.out=v;renderSetup()});
    seg(field('Legs zum Sieg (First to)',HELP.legs(S.legs)),[[1,'1'],[2,'2'],[3,'3'],[5,'5']],S.legs,v=>{S.legs=v;renderSetup()});
  }else if(S.game==='atc'){
    seg(field('Ende',HELP.atcBull[S.atcBull]),[[false,'Bis 20'],[true,'Bis Bull']],S.atcBull,v=>{S.atcBull=v;renderSetup()});
    seg(field('Double und Triple',HELP.atcSkip[S.atcSkip]),[[false,'Zählen einfach'],[true,'Springen 2 / 3 Felder']],S.atcSkip,v=>{S.atcSkip=v;renderSetup()});
  }else if(S.game==='hs'){
    seg(field('Runden',HELP.rounds(S.hsRounds)),[[5,'5'],[7,'7'],[10,'10'],[15,'15']],S.hsRounds,v=>{S.hsRounds=v;renderSetup()});
  }else{
    seg(field('Kniffelrunden auf dem Blatt',HELP.kn(S.knRounds)),[[5,'5'],[10,'10']],S.knRounds,v=>{S.knRounds=v;renderSetup()});
  }
  const pl=$('#plist');pl.innerHTML='';
  S.players=S.players.filter(n=>n&&n.trim());
  if(!S.players.length) pl.innerHTML='<p class="hint" style="margin:0">Noch niemand ausgewählt. Tippe unten auf die Namen der Mitspieler.</p>';
  const mk=(t,l,fn)=>{const x=document.createElement('button');x.textContent=t;x.setAttribute('aria-label',l);x.onclick=fn;return x};
  S.players.forEach((name,i)=>{
    const r=document.createElement('div');r.className='prow sel';
    r.innerHTML=`<span class="pnum">${i+1}</span><span class="pname">${esc(name)}</span>`;
    if(i>0) r.appendChild(mk('↑','Nach oben schieben',()=>{[S.players[i-1],S.players[i]]=[S.players[i],S.players[i-1]];buzz();renderSetup()}));
    r.appendChild(mk('×','Aus dem Spiel nehmen',()=>{S.players.splice(i,1);buzz();renderSetup()}));
    pl.appendChild(r);
  });
  const ro=$('#roster');ro.innerHTML='';
  const sel=new Set(S.players.map(n=>n.toLowerCase()));
  rosterNames().forEach(n=>{
    const c=document.createElement('button');c.className='rchip'+(sel.has(n.toLowerCase())?' on':'');c.textContent=n;
    c.setAttribute('aria-pressed',String(sel.has(n.toLowerCase())));
    c.onclick=()=>{
      const i=S.players.findIndex(p=>p.toLowerCase()===n.toLowerCase());
      if(i>=0) S.players.splice(i,1);
      else{if(S.players.length>=6){$('#rosterMsg').textContent='Höchstens 6 Spieler pro Spiel.';return}S.players.push(n)}
      $('#rosterMsg').textContent='';buzz();renderSetup();
    };
    ro.appendChild(c);
  });
  if(!roster.length) ro.innerHTML='<p class="hint" style="margin:0">Noch keine Spieler angelegt. Lege sie unten einmal an, danach tippst du sie nur noch an.</p>';
  $('#rosterHint').textContent=club
    ?'Die Spielerliste ist für alle Vereinsmitglieder gleich. Neu angelegte Spieler erscheinen sofort auf allen Handys.'
    :'Die Spielerliste liegt nur auf diesem Handy. Verbinde dich oben mit dem Verein, damit alle dieselbe Liste sehen.';
  $('#resumeBtn').hidden=!(G&&!G.over);
  store('dart.settings',S);
}
const newPlayer=()=>{
  const n=addPlayer($('#newP').value);if(!n)return;
  $('#newP').value='';$('#rosterMsg').textContent='';
  if(!S.players.some(p=>p.toLowerCase()===n.toLowerCase())&&S.players.length<6) S.players.push(n);
  buzz();renderSetup();
};
$('#addNew').onclick=newPlayer;$('#newP').onkeydown=e=>{if(e.key==='Enter')newPlayer()};
$('#manageP').onclick=()=>openRosterMgr();
$('#resumeBtn').onclick=()=>show('game');
$('#logBtn').onclick=()=>show('log');
$('#startBtn').onclick=()=>{
  if(!S.players.length){$('#rosterMsg').textContent='Bitte mindestens einen Spieler auswählen.';return}
  const names=S.players.slice();
  newGame({game:S.game,start:S.start,out:S.out,legsToWin:S.legs,atcBull:S.atcBull,atcSkip:S.atcSkip,rounds:S.hsRounds,krounds:S.knRounds,practice:S.practice,names});
};
function newGame(c){
  G={practice:!!c.practice,game:c.game,cfg:c,mode:c.game==='hs'?(S.hsMode||'final'):(S.mode==='final'?'darts':(S.mode||'darts')),cur:0,turn:[],over:null,winner:null,
     start:c.start,out:c.out,legsToWin:c.legsToWin,leg:1,legStarter:0,turnStart:c.start,
     atcBull:c.atcBull,atcSkip:c.atcSkip,rounds:c.rounds,round:1,kr:0,krounds:c.krounds||10,kplayed:0,
     players:c.names.map(n=>({name:n,score:c.start,legs:0,pts:0,darts:0,last:'',best:0,hi:0,target:1,hits:0,total:0,rest:0,sheet:Array(c.krounds||10).fill(null)}))};
  undo=[];entry='';mod=1;save();show('game');
}

/* ---------- Spielablauf ---------- */
function save(){store('dart.game2',G);store('dart.undo2',undo.slice(-150))}
function snap(){undo.push(JSON.stringify(G));if(undo.length>150)undo.shift()}
function doUndo(){if(!undo.length)return;const old=G;G=JSON.parse(undo.pop());if(old&&old.logId&&!G.logId){removeEntry(old.logId)}entry='';mod=1;closeOv();save();render();buzz()}
const dbl=()=>G.out==='double';
const tsum=()=>G.turn.reduce((a,d)=>a+(d.v||0),0);
const cur=()=>G.players[G.cur];
const dartLabel=(n,m)=>n===0?'0':n===25?(m===2?'Bull':'25'):(m===3?'T':m===2?'D':'')+n;

function throwDart(n){
  if(!G||G.over) return;
  let m=n===0?1:mod; if(n===25&&m===3) return;
  snap();buzz();
  const p=cur(),v=n*m;
  G.turn.push({l:dartLabel(n,m),v});p.darts++;mod=1;
  if(G.game==='hs'){
    p.total+=v;
    if(G.turn.length===3) endTurn(p);
  }else{
    p.pts+=v;p.score-=v;
    if(p.score<0||(dbl()&&p.score===1)||(p.score===0&&dbl()&&m!==2)) bust(p);
    else if(p.score===0) legWon(p);
    else if(G.turn.length===3) endTurn(p);
  }
  save();render();
}
function commitTotal(){
  if(!G||G.over||entry==='') return;
  const n=parseInt(entry,10);
  if(n>180||BAD_TOTAL.has(n)){flash('Ungültig');entry='';render();return}
  snap();buzz();
  const p=cur();G.turn=[{l:String(n),v:n}];p.darts+=3;entry='';
  if(G.game==='hs'){p.total+=n;endTurn(p)}
  else{
    p.pts+=n;p.score-=n;
    if(p.score<0||(dbl()&&p.score===1)) bust(p);
    else if(p.score===0){if(dbl()&&(G.turnStart>170||BOGEY.has(G.turnStart)))bust(p);else legWon(p)}
    else endTurn(p);
  }
  save();render();
}
function bust(p){p.pts-=tsum();p.score=G.turnStart;p.last='Bust';flash(p.name+': Bust');next()}
function endTurn(p){const s=tsum();p.last=String(s);if(s>p.hi)p.hi=s;if(s===180)flash('180!');else if(s>=140)flash(s+'!');next()}
function finishHs(){
  G.round=Math.min(G.round,G.rounds);G.over='match';
  const max=Math.max(...G.players.map(p=>p.total));G.winner=G.players.map((p,i)=>p.total===max?i:-1).filter(i=>i>=0);
}
function next(){
  const n=G.players.length;G.turn=[];
  for(let k=0;k<n;k++){
    G.cur=(G.cur+1)%n;
    if(G.game==='hs'&&G.cur===0){G.round++;if(G.round>G.rounds){finishHs();return}}
    if(!(G.game==='hs'&&cur().final)) break;
  }
  if(G.game==='x01') G.turnStart=cur().score;
  if(G.game==='hs'&&G.players.every(p=>p.final)) finishHs();
}
function commitFinal(){
  if(!G||G.over||entry==='') return;
  const n=parseInt(entry,10),max=G.rounds*180;
  if(n>max){flash('Höchstens '+num(max));entry='';render();return}
  snap();buzz();
  const p=cur();p.total=n;p.final=true;p.darts=G.rounds*3;p.last='Endstand';entry='';G.turn=[];
  if(G.players.every(q=>q.final)) finishHs(); else next();
  save();render();
}
function legWon(p){
  G.players.forEach((q,i)=>{if(i!==G.cur)q.rest=(q.rest||0)+q.score});
  const s=tsum();p.last=String(s);p.legs++;if(s>p.hi)p.hi=s;if(G.turnStart>p.best)p.best=G.turnStart;
  G.winner=[G.cur];G.over=p.legs>=G.legsToWin?'match':'leg';
}
function nextLeg(){
  G.leg++;G.legStarter=(G.legStarter+1)%G.players.length;
  G.players.forEach(p=>{p.score=G.start;p.last=''});
  G.cur=G.legStarter;G.turn=[];G.turnStart=G.start;G.over=null;G.winner=null;
  closeOv();save();render();
}

/* Around the Clock */
const atcEnd=()=>G.atcBull?21:20;
const tLabel=t=>t>20?'Bull':String(t);
function throwAtc(m){
  if(!G||G.over) return;
  snap();buzz();
  const p=cur();p.darts++;
  if(m===0){G.turn.push({l:'–',miss:true})}
  else{
    p.hits++;
    G.turn.push({l:(p.target>20?'':(m===3?'T':m===2?'D':''))+tLabel(p.target)});
    let nt=p.target+(G.atcSkip&&p.target<=20?m:1);
    if(p.target<=20&&nt>20) nt=21;
    p.target=nt;
    if(p.target>atcEnd()){p.target=atcEnd()+1;G.winner=[G.cur];G.over='match';p.last=String(G.turn.filter(d=>!d.miss).length)+' Treffer';save();render();return}
  }
  if(G.turn.length===3){p.last=G.turn.filter(d=>!d.miss).length+' Treffer';next()}
  save();render();
}

/* Kniffel */
const knSum=p=>p.sheet.reduce((a,v)=>a+(v||0),0);
const knFull=()=>{const f=[];for(let r=0;r<G.krounds;r++)if(G.players.every(p=>p.sheet[r]!=null))f.push(r);return f};
function knNextEmpty(){
  const n=G.players.length,T=G.krounds*n,start=G.kr*n+G.cur;
  for(let k=1;k<=T;k++){const idx=(start+k)%T,r=Math.floor(idx/n),i=idx%n;if(G.players[i].sheet[r]==null)return [r,i]}
  return null;
}
function commitKn(){
  if(!G||G.over||entry==='') return;
  const n=parseInt(entry,10);
  if(n>1575){flash('Höchstens 1.575');entry='';render();return}
  snap();buzz();
  const p=cur();p.sheet[G.kr]=n;p.total=knSum(p);entry='';
  const nx=knNextEmpty();
  if(nx){G.kr=nx[0];G.cur=nx[1]}else finishKn();
  save();render();
}
function finishKn(){
  const full=knFull();G.kplayed=full.length;
  G.players.forEach(p=>{p.total=full.reduce((a,r)=>a+p.sheet[r],0)});
  const max=Math.max(...G.players.map(p=>p.total));G.winner=G.players.map((p,i)=>p.total===max?i:-1).filter(i=>i>=0);
  G.over='match';
}
function renderKn(){
  const chips=G.practice?['<span class="chip pr">Übung</span>']:[];
  chips.push('<span class="chip g">Kniffel</span>',`<span class="chip">Runde ${G.kr+1} von ${G.krounds}</span>`);
  $('#info').innerHTML=chips.join('');
  const b=$('#board');b.className='board solo';
  let t=`<div class="sheet" id="sheet"><table><thead><tr><th>Runde</th>`+G.players.map((p,i)=>`<th class="${i===G.cur&&!G.over?'on':''}">${esc(p.name)}</th>`).join('')+`</tr></thead><tbody>`;
  for(let r=0;r<G.krounds;r++){
    t+=`<tr><th>${r+1}</th>`+G.players.map((p,i)=>{const v=p.sheet[r],on=r===G.kr&&i===G.cur&&!G.over;
      return `<td><button class="kc${on?' on':''}" data-r="${r}" data-i="${i}" aria-label="${esc(p.name)}, Runde ${r+1}">${on&&entry?entry:(v==null?'':v)}</button></td>`}).join('')+`</tr>`;
  }
  t+=`</tbody><tfoot><tr><th>Summe</th>`+G.players.map(p=>`<td>${num(knSum(p))}</td>`).join('')+`</tr></tfoot></table></div>`;
  b.innerHTML=t;
  b.querySelectorAll('.kc').forEach(c=>c.onclick=()=>{if(G.over)return;G.kr=+c.dataset.r;G.cur=+c.dataset.i;entry='';buzz();save();render()});
  const sh=$('#sheet'),on=b.querySelector('.kc.on');
  if(on){const row=on.closest('tr');const top=row.offsetTop-40;if(top<sh.scrollTop||row.offsetTop+row.offsetHeight>sh.scrollTop+sh.clientHeight-44)sh.scrollTop=Math.max(0,top-row.offsetHeight)}
  $('#slots').innerHTML='';
  const p=cur();
  $('#tv').textContent=entry||(p.sheet[G.kr]!=null?p.sheet[G.kr]:'0');
  const co=$('#co');co.textContent=`${p.name}, Kniffelrunde ${G.kr+1}`;co.className='co none';
  $('#modebar').style.display='none';
  renderPad();
  if(G.over==='match'&&!G.logId&&!G.practice) logResult();
  if(G.over) showWin(); else closeOv();
}

let tt;
function flash(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1100)}

/* ---------- Darstellung ---------- */
function render(){
  if(!G) return;
  if(G.game==='kn'){renderKn();return}
  const chips=G.practice?['<span class="chip pr">Übung</span>']:[];
  if(G.game==='x01'){chips.push(`<span class="chip g">${G.start}</span>`,`<span class="chip">${dbl()?'Double Out':'Single Out'}</span>`);
    if(G.legsToWin>1)chips.push(`<span class="chip">Leg ${G.leg}, First to ${G.legsToWin}</span>`)}
  else if(G.game==='atc'){chips.push(`<span class="chip g">Around the Clock</span>`,`<span class="chip">${G.atcBull?'Bis Bull':'Bis 20'}</span>`);
    if(G.atcSkip)chips.push(`<span class="chip">Double/Triple springen</span>`)}
  else chips.push(`<span class="chip g">Highscore</span>`,`<span class="chip">${G.mode==='final'?G.rounds+' Runden':'Runde '+G.round+' von '+G.rounds}</span>`);
  $('#info').innerHTML=chips.join('');

  const b=$('#board'),np=G.players.length;
  b.className='board'+(np===1?' solo':'')+(np>2?' many':'');
  b.innerHTML=G.players.map((p,i)=>{
    const act=i===G.cur&&!G.over?' active':'';
    if(G.game==='atc'){
      const end=atcEnd(),done=p.target-1;
      const bars=Array.from({length:end},(_,k)=>`<i class="${k<done?'d':k===done?'c':''}"></i>`).join('');
      const big=p.target>end?'✓':tLabel(p.target);
      return `<div class="p${act}"><div class="pn"><span>${esc(p.name)}</span></div>
        <div class="score"><small>Ziel</small>${big}</div><div class="prog">${bars}</div>
        <div class="stats"><span>Pfeile <b>${p.darts}</b></span><span>Treffer <b>${pct(p.hits,p.darts)}</b></span></div></div>`;
    }
    if(G.game==='hs'){
      return `<div class="p${act}"><div class="pn"><span>${esc(p.name)}</span></div>
        <div class="score">${p.total}</div>
        <div class="stats">${p.final?'<span><b>✓ Endstand eingetragen</b></span>':`<span>Ø <b>${p.darts?fmt1(p.total/p.darts*3):'–'}</b></span>${p.last?`<span>Letzte <b>${p.last}</b></span>`:''}`}</div></div>`;
    }
    const legs=G.legsToWin>1?`<span class="legs">${Array.from({length:G.legsToWin},(_,k)=>`<i class="${k<p.legs?'w':''}"></i>`).join('')}</span>`:'';
    return `<div class="p${act}"><div class="pn"><span>${esc(p.name)}</span>${legs}</div>
      <div class="score">${p.score}</div>
      <div class="stats"><span>Ø <b>${p.darts?fmt1(p.pts/p.darts*3):'–'}</b></span>${p.last?`<span>Letzte <b>${p.last}</b></span>`:''}</div></div>`;
  }).join('');

  if(G.game==='x01'&&G.mode==='final') G.mode='darts';
  const total=G.game!=='atc'&&G.mode==='total';
  const fin=G.game==='hs'&&G.mode==='final';
  $('#slots').innerHTML=total||fin?'':[0,1,2].map(i=>{const d=G.turn[i];
    return d?`<div class="slot${d.miss?' miss':''}">${d.l}</div>`:`<div class="slot e">${i+1}.</div>`}).join('');
  const p=cur(),tv=$('#tv'),co=$('#co');
  if(G.game==='atc'){tv.textContent=p.target>atcEnd()?'✓':tLabel(p.target);co.textContent='Nächstes Ziel';co.className='co none'}
  else if(G.game==='hs'){tv.textContent=total||fin?(entry||'0'):tsum();co.textContent=fin?`Endstand nach ${G.rounds} Runden`:`Runde ${G.round} von ${G.rounds}`;co.className='co none'}
  else{
    tv.textContent=total?(entry||'0'):tsum();
    const left=total?3:3-G.turn.length,c=checkout(p.score,left,dbl());
    if(c){co.textContent=c;co.className='co'}
    else{co.textContent=p.score<=170&&!total?'Kein Checkout mit '+left+(left===1?' Pfeil':' Pfeilen'):'';co.className='co none'}
  }
  $('#modebar').style.display=G.game==='atc'?'none':'';
  if(G.game!=='atc') seg($('#segMode'),[['darts','Einzelne Pfeile'],['total','Aufnahme Runde']].concat(G.game==='hs'?[['final','Endstand']]:[]),G.mode,v=>{G.mode=v;if(G.game==='hs')S.hsMode=v;else S.mode=v;store('dart.settings',S);entry='';mod=1;save();render()});
  renderPad();
  if(G.over==='match'&&!G.logId&&!G.practice) logResult();
  if(G.over) showWin(); else closeOv();
}
function renderPad(){
  const pad=$('#pad');pad.innerHTML='';pad.className='pad';
  const add=(t,cls,fn,attrs)=>{const k=document.createElement('button');k.className='k '+(cls||'');k.textContent=t;k.onclick=fn;
    if(attrs)for(const a in attrs)k.setAttribute(a,attrs[a]);pad.appendChild(k);return k};
  if(G.game==='atc'){
    pad.style.gridTemplateColumns='repeat(3,1fr)';
    const t=tLabel(cur().target),bull=cur().target>20;
    if(G.atcSkip&&!bull){
      add(t,'big gS',()=>throwAtc(1),{'aria-label':'Single '+t});
      add('D'+t,'big gD',()=>throwAtc(2),{'aria-label':'Double '+t});
      add('T'+t,'big gT',()=>throwAtc(3),{'aria-label':'Triple '+t});
    }else{
      add((bull?'Bull / 25':t)+' getroffen','big gS',()=>throwAtc(1)).style.gridColumn='1/-1';
    }
    add('Daneben','big',()=>throwAtc(0)).style.gridColumn='span 2';
    add('↶','big',doUndo,{'aria-label':'Rückgängig'});
    return;
  }
  if(G.game==='kn'||G.mode==='total'||(G.mode==='final'&&G.game==='hs')){
    const kn=G.game==='kn',fin=!kn&&G.mode==='final',ml=fin||kn?4:3;
    pad.style.gridTemplateColumns='repeat(3,1fr)';
    for(const n of [1,2,3,4,5,6,7,8,9]) add(String(n),'',()=>{if(entry.length<ml){entry=(entry+n).replace(/^0+(?=\d)/,'');buzz();render()}});
    add('⌫','sm',()=>{entry=entry.slice(0,-1);render()},{'aria-label':'Löschen'});
    add('0','',()=>{if(entry==='')entry='0';else if(entry.length<ml&&entry!=='0')entry+='0';render()});
    add('Eintragen','ok sm',kn?commitKn:fin?commitFinal:commitTotal);
    add('Rückgängig','sm',doUndo).style.gridColumn='1/-1';
    return;
  }
  pad.style.gridTemplateColumns='repeat(5,1fr)';
  pad.className='pad'+(mod===2?' mD':mod===3?' mT':'');
  add('Double','dbl sm s2',()=>{mod=mod===2?1:2;buzz();renderPad()},{'aria-pressed':String(mod===2)}).style.gridColumn='span 2';
  add('Triple','tpl sm s2',()=>{mod=mod===3?1:3;buzz();renderPad()},{'aria-pressed':String(mod===3)}).style.gridColumn='span 2';
  add('↶','sm',doUndo,{'aria-label':'Rückgängig'});
  for(let n=1;n<=20;n++) add(String(n),'num',()=>throwDart(n));
  const k25=add('25','',()=>throwDart(25));if(mod===3)k25.disabled=true;
  add('Bull','sm',()=>{mod=2;throwDart(25)},{'aria-label':'Bull, 50 Punkte'});
  add('Daneben','sm',()=>throwDart(0)).style.gridColumn='span 3';
}

/* ---------- Overlays ---------- */
function openOv(html){$('#ovCard').innerHTML=html;$('#ov').classList.add('on')}
function closeOv(){$('#ov').classList.remove('on')}
function statsTable(){
  let rows,head;
  if(G.game==='atc'){
    head='<th>Spieler</th><th>Ziel</th><th>Pfeile</th><th>Treffer</th>';
    rows=G.players.map((p,i)=>({i,h:`<td>${esc(p.name)}</td><td>${p.target>atcEnd()?'✓':tLabel(p.target)}</td><td>${p.darts}</td><td>${pct(p.hits,p.darts)}</td>`,k:p.target*1000-p.darts}));
  }else if(G.game==='kn'){
    head='<th>Spieler</th><th>Summe</th><th>Ø</th><th>Beste</th>';
    const full=knFull();
    rows=G.players.map((p,i)=>({i,h:`<td>${esc(p.name)}</td><td>${num(p.total)}</td><td>${full.length?fmt1(p.total/full.length):'–'}</td><td>${full.length?Math.max(...full.map(r=>p.sheet[r])):'–'}</td>`,k:p.total}));
  }else if(G.game==='hs'){
    head='<th>Spieler</th><th>Punkte</th><th>Ø</th><th>Höchste</th>';
    rows=G.players.map((p,i)=>({i,h:`<td>${esc(p.name)}</td><td>${p.total}</td><td>${p.darts?fmt1(p.total/p.darts*3):'–'}</td><td>${p.hi||'–'}</td>`,k:p.total}));
  }else{
    head='<th>Spieler</th><th>Legs</th><th>Ø</th><th>Höchste</th>';
    rows=G.players.map((p,i)=>({i,h:`<td>${esc(p.name)}</td><td>${p.legs}</td><td>${p.darts?fmt1(p.pts/p.darts*3):'–'}</td><td>${p.hi||'–'}</td>`,k:p.legs*10000-p.score}));
  }
  rows.sort((a,b)=>b.k-a.k);
  return `<table><tr>${head}</tr>`+rows.map(r=>`<tr class="${G.winner&&G.winner.includes(r.i)?'top1':''}">${r.h}</tr>`).join('')+`</table>`;
}
const pad2=n=>String(n).padStart(2,'0');
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const fmtDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})};
const fmtTime=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const eur=v=>v.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=v=>v.toLocaleString('de-DE');
function gameLabel(g){
  if(g.game==='x01') return g.start+' '+(g.out==='double'?'Double Out':'Single Out')+(g.legsToWin>1?', First to '+g.legsToWin:'');

}
function logResult(){

      legs:p.legs,darts:p.darts,won:G.winner.includes(i),scores:G.game==='kn'?knFull().map(r=>p.sheet[r]):null}))};

}

let fDay=null,fPlayer='';

$('#fPlayer').onchange=e=>{fPlayer=e.target.value;renderLog()};
const rnd05=v=>Math.round(v*2)/2;
const ptsOf=(e,p)=>S.basis==='rest'&&e.game==='x01'?p.rest:p.pts;
const lowerBetter=()=>S.basis==='rest';
function dayStats(entries,cat){
  const m={};
  entries.forEach(e=>e.players.forEach(p=>{
    const r=m[p.name]||(m[p.name]={name:p.name,games:0,rounds:0,wins:0,points:0});
    r.games++;if(p.won)r.wins++;
    if(e.game==='kn'){r.rounds+=e.rounds||0;r.points+=p.pts}
    else if(e.game!=='atc'){r.rounds++;r.points+=ptsOf(e,p)}
  }));
  const rows=Object.values(m);
  rows.forEach(r=>{r.raw=r.rounds?r.points/r.rounds/200:0;r.pay=r.rounds?rnd05(r.raw):0});
  if(cat==='kn') rows.sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name));
  else{const lb=lowerBetter();rows.sort((a,b)=>b.wins-a.wins||(lb?a.points-b.points:b.points-a.points)||a.name.localeCompare(b.name))}
  return rows;
}
function renderLog(){
  const cat=S.logCat==='kn'?'kn':'darts',KN=cat==='kn';

  const src=H.filter(e=>(e.game==='kn')===KN);
  const days=[...new Set(src.map(e=>e.day))].sort().reverse();

  if(fDay===null) fDay=days.includes(dayKey(Date.now()))?dayKey(Date.now()):(days[0]||'all');

  const body=$('#logBody');

  const has=e=>!fPlayer||e.players.some(p=>p.name===fPlayer);
  const cupName=KN?'Schierker Pokal Kniffel':'Schierker Pokal';
  const formula=KN
    ?`<p class="hint">Betrag pro Spieler = Summe aller Endstände des Abends ÷ gespielte Kniffelrunden ÷ 200, auf halbe bzw. ganze Euro gerundet.</p><p class="hint">Der Schierker Pokal Kniffel geht an den Spieler mit der höchsten Gesamtpunktzahl des Abends.</p>`
    :`<p class="hint">Betrag pro Spieler = Tagesergebnis ÷ gespielte Runden ÷ 200, auf halbe bzw. ganze Euro gerundet. Around the Clock zählt nur bei den Siegen, nicht beim Betrag.</p><p class="hint">Der Schierker Pokal geht an den Spieler mit den meisten Siegen des Tages. Bei Gleichstand entscheidet die höhere Punktzahl, bei Restpunkten die niedrigere.</p>`;
  if(fDay!=='all'){
    const all=src.filter(e=>e.day===fDay).sort((a,b)=>a.ts-b.ts);
    const rows=dayStats(all,cat),champ=rows[0];
    const vis=rows.filter(r=>!fPlayer||r.name===fPlayer);
    const kasse=rows.reduce((a,r)=>a+r.pay,0);
    const cupSub=KN?`${num(champ.points)} Punkte in ${champ.rounds} Kniffelrunden`:`${champ.wins} ${champ.wins===1?'Sieg':'Siege'} in ${champ.games} ${champ.games===1?'Runde':'Runden'}, ${num(champ.points)} Punkte`;
    let h=`<div class="cupcard"><img src="${HERO}" alt="${cupName}"><div><span>${cupName}, ${fmtDay(fDay)}</span><b>${esc(champ.name)}</b><small>${cupSub}</small></div></div>`;
    const mid=KN?'<th>Runden</th><th>Ø</th>':'<th>Runden</th><th>Siege</th>';
    h+=`<h3 class="lt">Tagesauswertung</h3><div class="tw"><table class="lt"><tr><th>Spieler</th>${mid}<th>Punkte</th><th>Betrag</th></tr>`+
      vis.map(r=>`<tr${r===champ?' class="top1"':''}><td>${r===champ?'🏆 ':''}${esc(r.name)}</td>${KN?`<td>${r.rounds}</td><td>${r.rounds?fmt1(r.points/r.rounds):'–'}</td>`:`<td>${r.games}</td><td>${r.wins}</td>`}<td>${num(r.points)}</td><td>${r.rounds?eur(r.pay):'–'}</td></tr>`).join('')+
      (fPlayer?'':`<tr class="sum"><td>Kasse gesamt</td><td></td><td></td><td></td><td>${eur(kasse)}</td></tr>`)+`</table></div>`;
    h+=`<div class="calc">`+vis.filter(r=>r.rounds).map(r=>`<div>${esc(r.name)}: ${num(r.points)} ÷ ${r.rounds} ÷ 200 = ${r.raw.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} → <b>${eur(r.pay)}</b></div>`).join('')+`</div>`+formula;
    h+=`<h3 class="lt">${KN?'Kniffel-Blätter':'Gespielte Runden'}</h3>`;
    all.forEach((e,i)=>{ if(!has(e))return;
      h+=`<div class="gcard"><div class="gh"><b>${KN?'Blatt':'Runde'} ${i+1}</b><span>${fmtTime(e.ts)} Uhr, ${esc(e.label)}</span><button class="del" data-id="${e.id}" aria-label="Eintrag löschen">✕</button></div>`+
        e.players.slice().sort((a,b)=>KN?b.pts-a.pts:(b.won-a.won)).map(p=>`<div class="gr${p.won?' won':''}${fPlayer===p.name?' me':''}"><span>${esc(p.name)}${p.won?' <em>Sieg</em>':''}</span><span>${
          e.game==='atc'?p.pts+' Treffer':e.game==='x01'?num(p.pts)+' geworfen, Rest '+num(p.rest):num(p.pts)+' Punkte'}</span></div>`+
          (KN&&p.scores?`<div class="gs">${p.scores.map(v=>`<i>${v}</i>`).join('')}</div>`:'')).join('')+`</div>`;
    });
    body.innerHTML=h;
  }else{
    let h=`<h3 class="lt">Spieltage</h3>`;
    const tot={};
    days.forEach(d=>{
      const all=src.filter(e=>e.day===d);const rows=dayStats(all,cat),champ=rows[0];
      rows.forEach(r=>{const t=tot[r.name]||(tot[r.name]={name:r.name,cups:0,wins:0,games:0,rounds:0,pay:0});t.wins+=r.wins;t.games+=r.games;t.rounds+=r.rounds;t.pay+=r.pay;if(r===champ)t.cups++});
      if(fPlayer&&!rows.some(r=>r.name===fPlayer))return;
      const me=fPlayer?rows.find(r=>r.name===fPlayer):null;
      const cnt=KN?all.reduce((a,e)=>a+(e.rounds||0),0)+' Kniffelrunden':all.length+(all.length===1?' Runde':' Runden');
      h+=`<button class="daycard" data-day="${d}"><span class="dd">${fmtDay(d)}</span><span class="dc">🏆 ${esc(champ.name)}</span><span class="dm">${cnt}, ${me?esc(me.name)+': '+eur(me.pay):'Kasse '+eur(rows.reduce((a,r)=>a+r.pay,0))}</span></button>`;
    });
    const trows=Object.values(tot).filter(t=>!fPlayer||t.name===fPlayer).sort((a,b)=>b.cups-a.cups||b.wins-a.wins);
    const mid=KN?'<th>Abende</th><th>Runden</th>':'<th>Siege</th><th>Runden</th>';
    h=`<h3 class="lt">Gesamtwertung</h3><div class="tw"><table class="lt"><tr><th>Spieler</th><th>Pokale</th>${mid}<th>Betrag</th></tr>`+
      trows.map((t,i)=>`<tr${i===0&&!fPlayer?' class="top1"':''}><td>${esc(t.name)}</td><td>${t.cups}</td>${KN?`<td>${t.games}</td><td>${t.rounds}</td>`:`<td>${t.wins}</td><td>${t.games}</td>`}<td>${eur(t.pay)}</td></tr>`).join('')+`</table></div>`+formula+h;
    body.innerHTML=h;
  }
  body.querySelectorAll('.daycard').forEach(b=>b.onclick=()=>{fDay=b.dataset.day;renderLog();document.getElementById('log').scrollTop=0});
  body.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    openOv(`<h3>Eintrag löschen?</h3><p>Der Eintrag wird aus dem Protokoll und der Auswertung entfernt.</p><div class="btns"><button class="pri" id="dy">Löschen</button><button id="dn">Abbrechen</button></div>`);
    $('#dy').onclick=()=>{removeEntry(b.dataset.id);closeOv();renderLog()};
    $('#dn').onclick=closeOv;
  });
}

}

  if(rUnsub)rUnsub();
  rcol=col.parent.collection('spieler');
  let first=true;
  rUnsub=rcol.onSnapshot({includeMetadataChanges:true},snap=>{
    roster=snap.docs.map(d=>({id:d.id,name:(d.data()||{}).name||d.id}));
    store('dart.roster.club',roster);
    if(first&&!snap.metadata.fromCache){
      first=false;
      const have=new Set(roster.map(r=>r.id)),add=new Map();
      (load('dart.rqueue')||[]).forEach(r=>add.set(r.id,r.name));
      if(!roster.length){
        H.forEach(e=>e.players.forEach(p=>add.set(rid(p.name),p.name)));
        (load('dart.roster')||[]).forEach(r=>add.set(r.id,r.name));
      }
      const todo=[...add].filter(([id])=>!have.has(id));
      if(todo.length){fbStart().then(db=>{const bt=db.batch();todo.forEach(([id,name])=>bt.set(rcol.doc(id),{name,created:Date.now()}));return bt.commit()}).then(()=>store('dart.rqueue',null)).catch(()=>{})}

function startSync(c){

    H=snap.docs.map(d=>d.data());
    sync.state=snap.metadata.fromCache?'offline':'online';sync.pending=snap.metadata.hasPendingWrites;if(!snap.metadata.fromCache)sync.last=Date.now();

async function initClub(){

  if(col){return}
  sync.state='connecting';onSync();
  try{startSync(await clubCol(club,false))}

}
window.addEventListener('online',()=>{if(club&&!col)initClub()});
function addEntry(e){

async function flushQueue(){

    openOv(`<h3>Verbindung trennen?</h3><p>Danach werden neue Spiele nur noch auf diesem Gerät gespeichert. Das gemeinsame Protokoll bleibt online erhalten.</p><div class="btns"><button class="pri" id="dy2">Trennen</button><button id="dn2">Abbrechen</button></div>`);
    $('#dn2').onclick=closeOv;
    $('#dy2').onclick=()=>{if(unsub)unsub();unsub=null;if(rUnsub)rUnsub();rUnsub=null;rcol=null;col=null;club='';roster=load('dart.roster')||[];store('dart.club',null);H=load('dart.history')||[];sync.state='local';closeOv();onSync();renderSetup()};
  };
}
$('#clubBtn').onclick=openClub;$('#clubBtn2').onclick=openClub;

/* ---------- Aktualisieren (Wischen von oben) ---------- */
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function refreshData(){
  if(!club) return 'Nicht mit dem Verein verbunden';
  if(!fbOk()) return 'Keine Verbindung zum Internet';
  try{
    if(!col){await initClub();if(!col) return 'Keine Verbindung zum Internet'}
    const db=await fbStart();
    try{await db.disableNetwork();await db.enableNetwork()}catch(e){}
    const [a,b]=await withTimeout(Promise.all([col.get({source:'server'}),rcol.get({source:'server'})]),12000);
    H=a.docs.map(d=>d.data());store('dart.history.club',H);
    roster=b.docs.map(d=>({id:d.id,name:(d.data()||{}).name||d.id}));store('dart.roster.club',roster);
    sync.state='online';sync.last=Date.now();
    await flushQueue();onSync();
    if($('#setup').classList.contains('on')) renderSetup();
    return 'Aktualisiert, '+H.length+(H.length===1?' Eintrag':' Einträge');
  }catch(e){
    sync.state='offline';onSync();
    return (e&&e.code==='permission-denied')?'Vereinspasswort ungültig':'Keine Verbindung zum Internet';
  }
}
const ptr=$('#ptr'),ptrTxt=$('#ptrTxt'),ptrI=$('#ptrI');
let ptrBusy=false;
function ptrSet(px,txt,cls){ptr.style.setProperty('--py',px+'px');ptr.style.opacity=px>0?Math.min(1,px/40):0;ptr.className='ptr'+(cls?' '+cls:'');if(txt)ptrTxt.textContent=txt}
function ptrHide(){ptr.style.transition='';ptrSet(0,'',)}
async function doRefresh(){
  ptrBusy=true;ptrSet(64,'Aktualisiere …','spin');ptrI.textContent='↻';
  const msg=await refreshData();
  ptrSet(64,msg,'done');ptrI.textContent=msg.startsWith('Aktualisiert')?'✓':'!';buzz();
  setTimeout(()=>{ptrHide();ptrBusy=false;ptrI.textContent='↓'},1600);
}
function attachPTR(el){
  let y0=0,dy=0,on=false;
  el.addEventListener('touchstart',e=>{
    on=!ptrBusy&&el.scrollTop<=0&&!$('#ov').classList.contains('on')&&e.touches.length===1;
    if(on){y0=e.touches[0].clientY;dy=0}
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!on)return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||el.scrollTop>0){ptrHide();return}
    const px=Math.min(dy*0.5,90),ready=px>=60;
    ptrSet(px,ready?'Loslassen zum Aktualisieren':'Zum Aktualisieren ziehen',ready?'ready':'');
    ptrI.style.transform=`rotate(${ready?180:Math.round(px*3)}deg)`;
  },{passive:true});
  el.addEventListener('touchend',()=>{
    if(!on)return;on=false;ptrI.style.transform='';
    if(dy*0.5>=60) doRefresh(); else ptrHide();
  });
}
attachPTR($('#setup'));attachPTR($('#log'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&club&&!col)initClub()});

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id==='setup'){closeOv();renderSetup()}else if(id==='log'){closeOv();renderLog()}else render();
}
roster=load(club?'dart.roster.club':'dart.roster')||[];
if(!S.v10){
  S.v10=1;
  const ph=n=>/^Spieler \d+$/.test(n);
  if(!club&&!roster.length){
    const m=new Map();
    H.forEach(e=>e.players.forEach(p=>{if(!ph(p.name))m.set(rid(p.name),p.name)}));
    S.players.forEach(n=>{if(n&&!ph(n.trim()))m.set(rid(n),n.trim())});
    roster=[...m].map(([id,name])=>({id,name}));store('dart.roster',roster);
  }
  S.players=S.players.filter(n=>n&&!ph(n.trim()));store('dart.settings',S);
}
show(G&&!G.over?'game':'setup');
if(club){H=load('dart.history.club')||[]}
onSync();initClub();
})();
</script>
